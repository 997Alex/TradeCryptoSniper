polymarket:
  gamma_api_base: "https://gamma-api.polymarket.com"
  clob_api_base: "https://clob.polymarket.com"
  # Client-side cap, applied per API host.
  rate_limit_rps: 20

trading:
  # Base slippage; scaled by liquidity and time-to-resolve in CryptoBot._slippage_pct.
  max_slippage_pct: 1.0
  stale_price_max_age_ms: 3000

paper_trading:
  initial_balance_usd: 100

crypto_5m:
  # Window timing. The entry ladder itself (90c -> 80c) lives in CryptoBot._threshold.
  execute_at_seconds: 20
  monitor_start_seconds: 60
  poll_interval_seconds: 0.5
  # Only fetch the CLOB order book for coins within this many cents of the threshold.
  book_enrich_margin_cents: 10

  # Position sizing
  risk_per_trade_pct: 10
  max_bet_usd_cap: 50
  kelly_fraction: 0.25
  min_data_trades: 5
  default_win_rate: 0.60
  min_liquidity_usd_entry: 200.0

  # Risk controls
  loss_size_multiplier: 0.50
  win_streak_restore: 3
  max_daily_drawdown_pct: 15.0
  max_consecutive_losses: 3
  loss_cooldown_seconds: 3600
  no_trade_cooldown_seconds: 300
  max_exposure_per_round_pct: 25.0
  # A position still unresolved after this long is written off as lost capital.
  unresolved_max_age_seconds: 900

kill_switch:
  enabled: true
  lock_file_path: "/tmp/crypto_bot_kill.lock"

logging:
  level: "INFO"
  file: "logs/crypto_bot.log"
