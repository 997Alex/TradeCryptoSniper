chain:
  rpc_url: "https://polygon-rpc.com"
  poly_contracts:
    exchange: "0x4bFb41d5B3570CfD8d127C5bD85D9A6F9b7b6c6b"
    ctp: "0x4D97DCd97eC945f40cF473F4d1C7A1c9e5Fc3c7c"
    usdc: "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174"

polymarket:
  gamma_api_base: "https://gamma-api.polymarket.com"
  clob_api_base: "https://clob.polymarket.com"
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  rate_limit_rps: 5

wallet:
  private_key: ""
  address: ""

trading:
  max_spend_per_trade_usd: 50
  max_slippage_pct: 1.0
  default_fee_pct: 0.5
  order_type: "FOK"
  partial_fill_min_pct: 50.0
  stale_price_max_age_ms: 2000
  min_price_cents: 90

paper_trading:
  enabled: true
  # Matches the live bankroll (on-chain collateral), so the percentage exposure
  # caps produce the same ~4 concurrent positions in paper as they would live.
  initial_balance_usd: 228
  resolve_check_interval_sec: 60
  max_concurrent_trades: 10

crypto_5m:
  enabled: true
  execute_at_seconds: 20
  monitor_start_seconds: 90
  poll_interval_seconds: 0.5
  fixed_bet_usd: 5
  min_bet_usd: 5
  max_bet_usd_cap: 12
  min_data_trades: 5
  default_win_rate: 0.60
  loss_size_multiplier: 0.50
  win_streak_restore: 3
  max_daily_drawdown_pct: 15.0
  max_consecutive_losses: 3
  loss_cooldown_seconds: 3600
  max_exposure_per_round_pct: 10.0
  min_resolve_buffer_seconds: 5
  slippage_model_pct: 0.5
  min_liquidity_usd_entry: 200.0
  liquidity_weight: 0.3
  # ── entry gate parameters ──
  safety_margin_cents: 5
  entry_price_cents_high: 95
  entry_price_cents_low: 85
  # ── safety mechanisms (set any to 0 to restore the original behaviour) ──
  # Sized from the first 7 trades: both losses were approved at 88¢, one booked
  # at 93¢, and both leapt into the band (+13¢ in one refresh, and 50¢->88¢ in
  # 40s) rather than settling there.
  max_effective_entry_cents: 88   # reject if the fill would book above this
  max_price_jump_cents: 5         # reject a leap into the band
  min_entry_seconds_left: 15      # no entries inside the final 15s
  price_settle_seconds: 20        # a price held this long counts as settled, not spiked
  # ── cross-round / correlation controls ──
  max_total_exposure_pct: 10.0
  # Do NOT raise this to 5 without also bounding the batch in the entry loop.
  # The three caps are read at crypto_bot.py:719/730/737, all BEFORE the first
  # await at :781, while :520 opens the batch with asyncio.gather -- so every
  # position in a batch tests the caps against identical pre-batch state. At 4
  # this is masked at the boundary (4 >= 4 blocks the whole batch); at 5 a
  # 2-coin batch on a full book yields 6 open and a 5-coin batch yields 9,
  # i.e. ~18% of equity against the 10% cap above.
  max_concurrent_open_positions: 4
  min_net_edge_cents: 4
  gas_buffer_cents: 1

scanner:
  scan_interval_sec: 60
  min_liquidity_usd: 200
  max_minutes_to_resolution: 43200
  min_price_cents: 90

kill_switch:
  enabled: true
  # Not /tmp: that is tmpfs and cleanable, so a kill file could silently vanish
  # and un-kill a stopped bot. Keep it beside the code.
  lock_file_path: "/home/ubuntu/projects/TradeCryptoSniper/KILL"
  check_interval_sec: 5

websocket:
  reconnect_base_delay_sec: 1.0
  reconnect_max_delay_sec: 30.0

alerts:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  min_balance_usd: 100

logging:
  level: "INFO"
  file: "logs/sniper.log"
